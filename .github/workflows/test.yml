name: "Test"

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Up DB
        run: docker compose up -d

      - name: Install goose
        run: |
          GOBIN=/user/local/bin go install github.com/pressly/goose/v3/cmd/goose@latest
          #curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh
          goose --version

      - name: Run migration
        run: goose mysql --allow-missing -dir migration "root:@tcp(localhost:3306)/test_db" up
