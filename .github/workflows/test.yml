name: "Test"

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
#    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Up DB
        run: |
          docker compose up -d
          sleep 15

      - name: Install goose
        run: |
          #GOBIN=/usr/local/bin go install -tags='no_clickhouse no_mssql no_postgres no_sqlite3 no_libsql no_vertica no_ydb' github.com/pressly/goose/v3/cmd/goose@latest
          curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh
          goose --version

      - name: Run migration
        run: goose mysql --allow-missing -dir migration "root:@tcp(localhost:3306)/test_db" up
