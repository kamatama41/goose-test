name: "Test"

on:
  pull_request:

jobs:
  test:
#    runs-on: ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Up DB
        run: |
          docker compose up -d
          sleep 5

      - name: Install goose
        run: |
          #GOBIN=/usr/local/bin go install github.com/pressly/goose/v3/cmd/goose@latest
          curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh
          goose --version

      - name: Run migration
        run: goose mysql --allow-missing -dir migration "root:@tcp(localhost:3306)/test_db" up
